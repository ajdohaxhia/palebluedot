<!doctype html><html><body><pre id="out">loading…</pre>
<script type="module">
import { Catalogs } from '../src/astronomy/catalogs.js';
const out = document.getElementById('out');
try {
  const c = new Catalogs('../data/');
  await c.load((p, label) => { out.textContent = `${(p*100).toFixed(0)}% ${label}`; });
  const s = c.starIndex.named.find(x => x.name === 'Sirius');
  const sirius = c.findStar('Sirius');
  const andromedaObj = c.lookupObject('Andromeda');
  const andromeda = andromedaObj ? andromedaObj.data : null;
  const trap = c.findPlanet('TRAPPIST-1e');
  const exoSystem = c.findSystem('TRAPPIST-1');
  const results = c.searchIndex();
  window.__CATALOG_RESULT = {
    ok: true,
    stars: c.stars.count,
    named: c.starIndex.named.length,
    systems: c.exo.systemCount,
    planets: c.exo.count,
    galaxies: c.sdss.count,
    quasars: c.quasars?.count || 0,
    sirius: sirius ? { name: sirius.name, dist: sirius.distPc, spect: sirius.spect, mag: sirius.mag, world: sirius.world } : null,
    andromeda: andromeda ? { name: andromeda.name, world: andromeda.world, dist: andromeda.distMpc } : null,
    trappist: trap ? { planet: trap.planet.name, host: trap.system.host, planets: trap.system.planets.length } : null,
    searchEntries: results.length,
    searchSirius: results.filter(r => r.name === 'Sirius').length,
    cosmosDistances: {
      m31: andromeda?.world ? Math.hypot(andromeda.world.x, andromeda.world.y, andromeda.world.z) : null,
    },
  };
  out.textContent = JSON.stringify(window.__CATALOG_RESULT, null, 2);
} catch (e) {
  window.__CATALOG_RESULT = { ok: false, error: e.message, stack: e.stack };
  out.textContent = 'ERROR: ' + e.stack;
}
</script></body></html>
